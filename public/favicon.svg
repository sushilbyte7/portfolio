<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18142c"/>
      <stop offset="100%" stop-color="#090917"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#854ce6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Glowing Code Elements -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 182 160 L 106 256 L 182 352" fill="none" stroke="#F5F7FA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 330 160 L 406 256 L 330 352" fill="none" stroke="#F5F7FA" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Slash / -->
    <line x1="292" y1="138" x2="220" y2="374" stroke="url(#slashGrad)" stroke-width="32" stroke-linecap="round"/>
  </g>
</svg>

